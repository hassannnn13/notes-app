<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Note</h1>
        <form method="post">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" value="{{ note.title }}" required>

            <label for="content">Content:</label>
            <input type="text" name="content" id="content" value="{{ note.content }}" required>

            <label for="category">Category:</label>
            <input type="text" name="category" id="category" value="{{ note.category }}">

            <label for="pinned">
                <input type="checkbox" name="pinned" id="pinned" {% if note.pinned %}checked{% endif %}>
                Pinned
            </label>

            <button type="submit">Save</button>
            <a href="{{ url_for('home') }}" class="cancel">Cancel</a>gi
        </form>
    </div>
</body>
</html>
